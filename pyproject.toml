[project]
name = "egg-price-forecast"
version = "0.1.0"
description = "Predict BLS egg price direction for Kalshi trading"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "numpy>=1.26",
    "cryptography>=42.0",
    "scipy>=1.12",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
